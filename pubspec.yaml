name: safezone_mobile
description: SafeZone AI Mobile — تطبيق مراقبة السلامة وكشف الكمامات محلياً عبر LiteRT/TFLite بواجهة عربية RTL.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.3.3+1
  crypto: ^3.0.5
  uuid: ^4.5.1
  share_plus: ^10.0.2
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/models/
